name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: techmindd-ai
  REGION: asia-south1
  GEMINI_SECRET: techmindd-gemini-api-key

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy full-stack application
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --port 8000 \
            --allow-unauthenticated \
            --set-env-vars 'PROVIDER=gemini,RAG_ENABLED=true,RAG_TOP_K=4,RATE_LIMIT_PER_MINUTE=60,TECHMINDD_API_KEYS=' \
            --set-secrets "GEMINI_API_KEY=${GEMINI_SECRET}:latest" \
            --memory 2Gi \
            --cpu 2 \
            --timeout 120 \
            --quiet

      - name: Verify deployed health endpoint
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project "${{ secrets.GCP_PROJECT_ID }}" --region "$REGION" --format='value(status.url)')"
          curl --fail --retry 5 --retry-delay 5 "$URL/health"
          echo "Live URL: $URL"
