name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q tests/test_template_engine.py tests/test_rag_pipeline.py tests/test_learning_assistant.py
      - name: Integration tests
        run: pytest -q tests/test_director_integration.py tests/test_api_hardening.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Python dependency audit
        # These Chroma advisories affect its authenticated network server. This
        # application uses only an in-process PersistentClient and does not run
        # or expose Chroma's HTTP API. Upstream lists no patched version yet.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln GHSA-2wm9-hf6c-p5cr
          --ignore-vuln GHSA-36p7-vc44-83pf
          --ignore-vuln GHSA-xph7-9rjv-w5fr
      - name: Static security scan
        run: bandit -q -r api observability -x tests
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only
          echo "FIXED_PACKAGE_LOCK=$(base64 -w0 package-lock.json)"
          npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          push: false
          tags: techmindd-ai:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
